<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GestARClimAS - Autenticação & Acesso</title>
  
  <!-- Favicon Oficial GestARClimAS -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  
  <!-- Meta tags institucionais e SEO -->
  <meta name="description" content="Sistema de Autenticação - GestARClimAS: Gestão da Pegada Ecológica Escolar & ODS 13." />
  <meta name="author" content="Projeto GestARClimAS" />

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Estilos da Aplicação -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body class="auth-page-body">

  <div class="auth-page-container">
    <div class="auth-card">
      <div class="auth-header">
        <img src="assets/logo_gestarclimas.jpg" alt="GestARClimAS" class="auth-logo-img" />
        <p class="auth-subtitle">Gestão da Pegada Ecológica Escolar & ODS 13</p>
      </div>

      <!-- Abas de Alternância: Entrar vs Criar Conta -->
      <div class="auth-tabs" id="authTabsHeader">
        <button type="button" class="auth-tab-btn active" id="authTabLogin">Entrar</button>
        <button type="button" class="auth-tab-btn" id="authTabRegister">Criar Conta</button>
      </div>

      <!-- 1. FORMULÁRIO DE LOGIN -->
      <div id="boxAuthLogin" class="auth-form-box">
        <button type="button" class="btn-google" id="btnGoogleLogin">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Entrar com Google</span>
        </button>

        <div class="auth-divider">
          <span>ou entre com e-mail</span>
        </div>

        <form id="formAuthLogin">
          <div class="form-group">
            <label class="form-label" for="loginEmail">E-mail Institucional ou Pessoal <span class="req">*</span></label>
            <input type="email" id="loginEmail" class="form-input" placeholder="" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label class="form-label" for="loginPassword">Senha <span class="req">*</span></label>
            <input type="password" id="loginPassword" class="form-input" placeholder="" required autocomplete="current-password" />
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.85rem; margin-top: 0.5rem;">
            Acessar Plataforma
          </button>
        </form>
      </div>

      <!-- 2. FORMULÁRIO DE CADASTRO (APENAS DADOS BÁSICOS) -->
      <div id="boxAuthRegister" class="auth-form-box" style="display: none;">
        <button type="button" class="btn-google" id="btnGoogleRegister">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Cadastrar com Google</span>
        </button>

        <div class="auth-divider">
          <span>ou preencha seus dados</span>
        </div>

        <form id="formAuthRegister">
          
          <!-- Upload de Foto de Perfil -->
          <div class="auth-photo-section">
            <div class="auth-photo-wrapper">
              <img id="regPhotoPreview" src="assets/favicon.svg" alt="Foto de Perfil" class="auth-photo-preview" />
              <label for="regPhotoInput" class="auth-photo-btn" title="Selecionar foto">
                <img src="assets/icons/camera.svg" class="icon-img" alt="" />
              </label>
              <input type="file" id="regPhotoInput" accept="image/*" style="display: none;" />
            </div>
            <div style="flex: 1;">
              <div style="font-size: 0.85rem; font-weight: 700; color: var(--neutral-800);">Foto de Perfil (Opcional)</div>
              <div style="font-size: 0.75rem; color: var(--neutral-500);">Clique no ícone da câmera para escolher sua foto.</div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="regName">Nome Completo <span class="req">*</span></label>
            <input type="text" id="regName" class="form-input" placeholder="" required autocomplete="name" />
          </div>

          <div class="form-group">
            <label class="form-label" for="regEmail">E-mail <span class="req">*</span></label>
            <input type="email" id="regEmail" class="form-input" placeholder="" required autocomplete="email" />
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="regPassword">Senha <span class="req">*</span></label>
              <input type="password" id="regPassword" class="form-input" placeholder="" minlength="6" required autocomplete="new-password" />
            </div>
            <div class="form-group">
              <label class="form-label" for="regPasswordConfirm">Confirmar Senha <span class="req">*</span></label>
              <input type="password" id="regPasswordConfirm" class="form-input" placeholder="" minlength="6" required autocomplete="new-password" />
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.85rem; margin-top: 0.5rem;">
            Concluir Cadastro & Acessar
          </button>
        </form>
      </div>

    </div>
  </div>

  <!-- Container de Toasts -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Firebase SDK Oficial & Configuração do Projeto -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="js/config/firebase-config.js"></script>

  <!-- Scripts da Aplicação -->
  <script src="js/services/AuthService.js"></script>
  <script src="js/views/AuthView.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const authService = new AuthService();

      // Se já estiver logado no Firebase, redireciona diretamente para o index.html
      await authService.garantirAutenticacaoPronta();
      if (authService.estaAutenticado()) {
        window.location.replace('index.html');
        return;
      }

      // Função simples de exibição de toast na página de login
      window.gestarclimasApp = {
        showToast: (message, type = 'info') => {
          const container = document.getElementById('toastContainer');
          if (!container) return;
          const toast = document.createElement('div');
          toast.className = `toast toast-${type}`;
          toast.innerHTML = `
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            </svg>
            <span>${message}</span>
          `;
          container.appendChild(toast);
          setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(10px)';
            setTimeout(() => toast.remove(), 300);
          }, 3500);
        }
      };

      const authView = new AuthView(authService);
      authView.init((user) => {
        window.location.replace('index.html');
      });
    });
  </script>
</body>
</html>
